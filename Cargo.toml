[package]
name = "galeikan"
version = "0.1.0"
edition = "2021"
description = "Galeikan research language"
publish = false

[dependencies]
sha2 = "0.11.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
libc = "0.2"

[[bin]]
name = "galeikan"
path = "src/main.rs"
